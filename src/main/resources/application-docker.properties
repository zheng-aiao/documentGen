# Docker环境配置
spring.application.name=documentGen
server.port=9001

# Redis配置（通过环境变量覆盖）
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:Nucleus!}
spring.data.redis.timeout=10000
redis.key-prefix=swagger:

# Genew配置（通过环境变量覆盖）
genew.server-url=${GENEW_SERVER_URL:https://newdev.rdapp.com:53839/swagger/swagger-resources}
genew.document-output-path=${GENEW_DOCUMENT_OUTPUT_PATH:/var/numax/genew}

# scheduler graceful shutdown to avoid using destroyed beans during shutdown
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

